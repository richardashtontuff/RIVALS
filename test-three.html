<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js Test</title>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js"
  }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #canvas { position: absolute; inset: 0; display: block; }
  #status { position: absolute; top: 10px; left: 10px; color: #fff; font-family: monospace; z-index: 100; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 4px; }
</style>
</head>
<body>
<div id="canvas"></div>
<div id="status">loading...</div>
<script type="module">
import * as THREE from 'three';

const status = document.getElementById('status');
const canvasEl = document.getElementById('canvas');

// WebGL check
const gl = document.createElement('canvas').getContext('webgl');
status.textContent = 'WebGL: ' + (!!gl ? 'YES' : 'NO');

if (!gl) {
  status.style.color = '#f00';
  throw new Error('WebGL not supported');
}

try {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x4488ff);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  canvasEl.appendChild(renderer.domElement);

  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
  const cube = new THREE.Mesh(geometry, material);
  scene.add(cube);

  const light = new THREE.PointLight(0xffffff, 1);
  light.position.set(2, 2, 4);
  scene.add(light);

  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;
    renderer.render(scene, camera);
  }
  animate();

  status.textContent = 'Three.js WORKING - red rotating cube should be visible';
  status.style.color = '#0f0';
} catch (e) {
  status.textContent = 'ERROR: ' + e.message;
  status.style.color = '#f00';
  console.error(e);
}
</script>
</body>
</html>
