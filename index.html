<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIVALS (Web Edition)</title>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js"
  }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  #canvas { position: absolute; inset: 0; display: block; background: #000; }

  /* Spec §8.1: dot crosshair, red #ff0d00 with black outline (#000000), thickness 4. */
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
    transform: translate(-50%, -50%); pointer-events: none; opacity: 0;
  }
  #crosshair .dot {
    position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
    background: #ff0d00; transform: translate(-50%, -50%);
    border-radius: 50%; box-shadow: 0 0 0 2px #000000;
  }

  #lock {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 1.3rem; pointer-events: none; user-select: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
  #hud {
    position: absolute; bottom: 26px; left: 26px; color: #fff;
    font-size: 1.15rem; pointer-events: none; user-select: none; line-height: 1.5;
    text-shadow: 0 0 6px rgba(0,0,0,0.8);
  }
  #ammo { font-variant-numeric: tabular-nums; font-size: 1.25rem; }
  #hp { opacity: 0.95; }
</style>
</head>
<body>
  <div id="canvas"></div>
  <div id="crosshair"><div class="dot"></div></div>
  <div id="lock">CLICK TO PLAY • WASD to move • SHIFT sprint • C to slide • SPACE jump • Q dash • R reload • 1 rifle / 3 fists</div>
  <div id="hud"><div id="ammo">20 / 100</div><div id="hp">HP 150</div></div>

  <!-- Kill feed (top-right, spec §8.4) -->
  <div id="killfeed" style="
    position:absolute; top:10px; right:10px; color:#fff;
    font-size:0.85rem; pointer-events:none; user-select:none;
    text-shadow:0 0 6px rgba(0,0,0,0.8); line-height:1.4; max-width:320px;">
  </div>

  <!-- Key balance (top, spec §8.4) -->
  <div id="keybalance" style="
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    color:#44ff44; font-size:0.9rem; pointer-events:none; user-select:none;
    text-shadow:0 0 6px rgba(0,0,0,0.8); font-weight:700; display:none;">
    Keys: <span id="keycount">0</span>
  </div>

  <!-- Settings menu (spec §8.2) -->
  <div id="settings" style="
    position:fixed; inset:0; background:rgba(0,0,0,0.85);
    display:none; z-index:100; color:#fff; font-family:system-ui;
    padding:2rem; overflow-y:auto;">
    <div style="max-width:520px;margin:auto;">
      <h2 style="margin-top:0">Settings</h2>
      <div style="margin:1rem 0;">
        <label style="display:block;margin-bottom:0.5rem;color:#aaa">FOV (90–105)</label>
        <input type="range" id="setFov" min="90" max="105" step="1" style="width:100%">
      </div>
      <div style="margin:1rem 0;">
        <label style="display:block;margin-bottom:0.5rem;color:#aaa">Mouse Sensitivity</label>
        <input type="range" id="setSens" min="1" max="10" step="0.1" style="width:100%">
      </div>
      <div style="margin:1rem 0;">
        <label style="display:block;margin-bottom:0.5rem;color:#aaa">Crosshair Dot Color</label>
        <input type="color" id="setCrossColor" value="#ff0d00">
      </div>
      <div style="margin:1rem 0;">
        <label style="display:block;margin-bottom:0.5rem;color:#aaa">Crosshair Thickness (px)</label>
        <input type="range" id="setCrossThick" min="1" max="12" step="1" style="width:100%">
      </div>
      <div style="margin:1rem 0;">
        <label style="display:block;margin-bottom:0.5rem;color:#aaa">Outline</label>
        <select id="setCrossOutline" style="width:100%">
          <option value="round">Round</option>
          <option value="none">None</option>
        </select>
      </div>
      <div style="margin:1rem 0;">
        <label style="display:block;margin-bottom:0.5rem;color:#aaa">Static Crosshair</label>
        <input type="checkbox" id="setCrossStatic">
      </div>
      <div style="margin:1rem 0;">
        <label style="display:block;margin-bottom:0.5rem;color:#aaa">Graphics Quality</label>
        <select id="setGraphics" style="width:100%">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div style="margin:1rem 0;">
        <label style="display:block;margin-bottom:0.5rem;color:#aaa">Max Frame Rate</label>
        <select id="setMaxFps" style="width:100%">
          <option value="60">60</option>
          <option value="144" selected>144</option>
          <option value="0">Unlimited</option>
        </select>
      </div>
      <div style="margin:1rem 0; padding-top:1rem; border-top:1px solid #444;">
        <label style="display:block;margin-bottom:0.5rem;color:#aaa">Texture Packs (spec §8.3)</label>
        <label style="display:block;margin-bottom:0.25rem;"><input type="checkbox" id="setNoTextures"> No textures</label>
        <label style="display:block;margin-bottom:0.25rem;"><input type="checkbox" id="setNoSkybox"> No skybox</label>
        <label style="display:block;margin-bottom:0.25rem;"><input type="checkbox" id="setNoHands"> No hands</label>
      </div>
      <button id="closeSettings" style="
        margin-top:1.5rem;padding:0.6rem 1.2rem;background:#444;color:#fff;
        border:1px solid #666;cursor:pointer;">Close</button>
      <button id="resetSettings" style="
        margin-top:0.5rem;padding:0.6rem 1.2rem;background:#622;color:#fff;
        border:1px solid #844;cursor:pointer;">Reset to Defaults</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
